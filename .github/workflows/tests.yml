name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # macOS entries are Apple Silicon (arm64): corpus-forge and key-gen
        # ship no x86_64-macOS wheels/binaries, so Intel macOS is unsupported.
        # macos-26 is the latest (Tahoe); macos-14 keeps older-arm64 coverage.
        os: [ubuntu-24.04, macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      # The Linux sandbox needs a rootless `bwrap`, which isn't available
      # on GitHub runners (unprivileged user namespaces are restricted), so
      # `brew doctor` fails during `--only-setup`. Disable it. No-op on macOS.
      HOMEBREW_NO_SANDBOX_LINUX: 1
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
